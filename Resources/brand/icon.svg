<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2B31"/>
      <stop offset="0.55" stop-color="#141519"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="300" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E9EE"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- the notch, hanging from the top edge -->
    <path d="M318 100 h388 c-18 0 -26 8 -26 26 v20 c0 34 -27 60 -60 60 H404 c-33 0 -60 -26 -60 -60 v-20 c0 -18 -8 -26 -26 -26 z" fill="#000"/>
    <circle cx="512" cy="152" r="17" fill="#0F1A2E"/>
    <circle cx="512" cy="152" r="8" fill="#22375E"/>
    <circle cx="507" cy="147" r="3" fill="#6E8BC4" opacity="0.8"/>
  </g>

  <!-- script lines: the one being read is bright, with a yellow marker -->
  <rect x="268" y="398" width="440" height="50" rx="25" fill="#FFFFFF" opacity="0.26"/>
  <rect x="268" y="506" width="520" height="62" rx="31" fill="url(#line)"/>
  <rect x="200" y="502" width="34" height="70" rx="17" fill="#FFD60A" filter="url(#soft)" opacity="0.7"/>
  <rect x="204" y="506" width="26" height="62" rx="13" fill="url(#marker)"/>
  <rect x="268" y="626" width="380" height="50" rx="25" fill="#FFFFFF" opacity="0.26"/>
  <rect x="268" y="734" width="250" height="50" rx="25" fill="#FFFFFF" opacity="0.12"/>

  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
