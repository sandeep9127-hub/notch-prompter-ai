name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NotchCoach.app
        run: ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NotchCoach
          path: |
            build/NotchCoach.dmg
            build/NotchCoach.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NotchCoach build ${{ github.run_number }}
          files: |
            build/NotchCoach.dmg
            build/NotchCoach.zip
          make_latest: true
          generate_release_notes: true
          body: |
            ## Download
            **[NotchCoach.dmg](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/NotchCoach.dmg)** — open it and drag NotchCoach into Applications.

            Needs an Apple-silicon Mac (M1 or newer) with macOS 14 or later.

            ## First launch
            NotchCoach isn't from the App Store, so macOS asks before opening it. Open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Or run:
            ```
            xattr -dr com.apple.quarantine /Applications/NotchCoach.app
            ```
            Updating? Quit NotchCoach first (`killall NotchCoach`), then replace the app. macOS may ask for permissions again.
